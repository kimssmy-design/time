<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>삶과 죽음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/album.css">
<link rel="stylesheet" href="css/notebook.css">
</head>
<body class="theme-album">
  <!-- 종이 질감 (모든 회차 공통, 테마별로 진하기만 바뀜) -->
  <svg class="grain" aria-hidden="true" width="100%" height="100%">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
    <rect width="100%" height="100%" filter="url(#grain)"></rect>
  </svg>

  <header class="top">
    <div class="top-inner">
      <div class="top-left"><span id="topTitle">삶과 죽음</span> <span id="topProgress" class="top-sub"></span></div>
      <button id="helpBtn" class="help-btn" type="button">? 사용법</button>
    </div>
  </header>

  <main id="stage" class="stage"></main>

  <div id="loading" class="loading" hidden>
    <div class="loading-box"><span class="spinner" aria-hidden="true"></span><p id="loadingMsg">잠시만 기다려 주세요</p></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <div id="help" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-labelledby="helpTitle">
      <h2 id="helpTitle">사용법</h2>
      <ol class="help-list">
        <li><b>주인공</b>이 되어 이야기를 읽어요.</li>
        <li><b>화면을 누르면</b> 다음 대사가 나와요.</li>
        <li>선택지에 <b>정답은 없어요.</b> 내 마음대로 골라요.</li>
        <li><b>처음 고른 길</b>만 기록돼요.</li>
        <li>끝나면 <b>소감</b>을 쓰고 제출해요. 이름은 공개되지 않아요.</li>
      </ol>
      <p class="help-care">읽다가 마음이 힘들면 언제든 선생님께 말해요.</p>
      <button id="helpClose" class="btn-main" type="button">닫기</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/reflect.js"></script>
  <script src="js/ep1.js"></script>
  <script src="js/ep2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
